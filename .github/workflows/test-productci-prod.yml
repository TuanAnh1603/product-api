
name: Product API - Production CI and CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: INTEGRATION TEST
  # ==========================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start production API
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: |
          nohup npm start >/tmp/product-api.log 2>&1 &

      - name: Wait for API healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/product-api.log
          exit 1

      - name: Run CRUD integration tests
        env:
          API_URL: http://127.0.0.1:3000
        run: npm test

      - name: Build Docker image for testing
        run: docker build -t product-api:ci .

      - name: Verify Docker container healthcheck
        run: |
          set -e

          docker network create ci-net
          docker run -d \
            --name ci-mongo \
            --network ci-net \
            mongo:7

          for i in $(seq 1 30); do
            if docker exec ci-mongo \
              mongosh --quiet --eval 'db.adminCommand("ping").ok'; then
              break
            fi
            sleep 2
          done

          docker run -d \
            --name ci-api \
            --network ci-net \
            -e MONGO_URI=mongodb://ci-mongo:27017/productdb \
            -p 3001:3000 \
            product-api:ci

          for i in $(seq 1 30); do
            status=$(docker inspect \
              --format='{{.State.Health.Status}}' ci-api 2>/dev/null || true)

            if [ "$status" = "healthy" ]; then
              echo "Product API is healthy"
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker logs ci-api
              exit 1
            fi

            sleep 2
          done

          docker logs ci-api
          exit 1

      - name: Cleanup test containers
        if: always()
        run: |
          docker rm -f ci-api ci-mongo 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true

  # ==========================================
  # JOB 2: BUILD AND PUSH TO DOCKER HUB
  # ==========================================
  publish:
    name: Build and Push to Docker Hub
    needs: integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            anhtuan1603/product-api:latest
            anhtuan1603/product-api:${{ github.sha }}

  # ==========================================
  # JOB 3: DEPLOY TO LOCAL DOCKER ENGINE
  # ==========================================
  deploy-local:
    name: Deploy to Local Docker Engine
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, product-api-local]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: pwsh
        run: |
          $env:DOCKER_PASSWORD | docker login `
            --username $env:DOCKER_USERNAME `
            --password-stdin

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Hub login failed"
          }

      - name: Pull and deploy image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        shell: pwsh
        run: |
          docker compose -f docker-compose-prod.yaml pull

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image pull failed"
          }

          docker compose -f docker-compose-prod.yaml up -d --remove-orphans

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose deployment failed"
          }

      - name: Verify deployed API health
        shell: pwsh
        run: |
          $healthy = $false

          for ($i = 0; $i -lt 30; $i++) {
            $status = docker inspect `
              --format='{{.State.Health.Status}}' `
              product-api-prod-container 2>$null

            if ($status -eq "healthy") {
              Write-Host "Product API is healthy"
              $healthy = $true
              break
            }

            if ($status -eq "unhealthy") {
              docker logs product-api-prod-container
              throw "Product API is unhealthy"
            }

            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            docker logs product-api-prod-container
            throw "Product API healthcheck timed out"
          }

      - name: Logout from Docker Hub
        if: always()
        shell: pwsh
        run: |
          docker logout