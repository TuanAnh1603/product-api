name: Product API - Production CI and CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: anhtuan1603/product-api

jobs:
  # ==========================================
  # JOB 1: INTEGRATION TEST
  # ==========================================
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    steps:
      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------
      # Node.js
      # ------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------
      # Install dependencies
      # ------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ------------------------------------------
      # Start API
      # ------------------------------------------
      - name: Start production API
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/productdb
        run: |
          nohup npm start >/tmp/product-api.log 2>&1 &

      # ------------------------------------------
      # Wait for API
      # ------------------------------------------
      - name: Wait for API healthcheck
        run: |
          echo "Waiting for API..."

          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:3000/health; then
              echo ""
              echo "API is healthy"
              exit 0
            fi

            echo "Attempt $i/30 failed"
            sleep 2
          done

          echo "API failed to start"
          echo "========== API LOG =========="
          cat /tmp/product-api.log
          echo "============================="
          exit 1

      # ------------------------------------------
      # Integration tests
      # ------------------------------------------
      - name: Run CRUD integration tests
        env:
          API_URL: http://127.0.0.1:3000
        run: npm test

      # ------------------------------------------
      # Build Docker image
      # ------------------------------------------
      - name: Build Docker image for testing
        run: |
          docker build \
            -t product-api:ci \
            .

      # ------------------------------------------
      # Test Docker container
      # ------------------------------------------
      - name: Verify Docker container healthcheck
        run: |
          set -e

          echo "Creating Docker network..."
          docker network create ci-net

          echo "Starting MongoDB..."
          docker run -d \
            --name ci-mongo \
            --network ci-net \
            mongo:7

          echo "Waiting for MongoDB..."

          mongo_ready=false

          for i in $(seq 1 30); do
            if docker exec ci-mongo \
              mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q "1"; then

              echo "MongoDB is ready"
              mongo_ready=true
              break
            fi

            echo "MongoDB attempt $i/30"
            sleep 2
          done

          if [ "$mongo_ready" != "true" ]; then
            echo "MongoDB failed to start"
            docker logs ci-mongo
            exit 1
          fi

          echo "Starting Product API..."

          docker run -d \
            --name ci-api \
            --network ci-net \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e MONGO_URI=mongodb://ci-mongo:27017/productdb \
            -p 3001:3000 \
            product-api:ci

          echo "Waiting for Product API..."

          for i in $(seq 1 30); do
            status=$(docker inspect \
              --format='{{.State.Health.Status}}' \
              ci-api 2>/dev/null || true)

            echo "Health status: $status"

            if [ "$status" = "healthy" ]; then
              echo "Product API is healthy"
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              echo "Product API is unhealthy"
              docker logs ci-api
              exit 1
            fi

            sleep 2
          done

          echo "Product API healthcheck timed out"
          docker logs ci-api
          exit 1

      # ------------------------------------------
      # Cleanup
      # ------------------------------------------
      - name: Cleanup test containers
        if: always()
        run: |
          docker rm -f ci-api ci-mongo 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true


  # ==========================================
  # JOB 2: BUILD AND PUSH TO DOCKER HUB
  # ==========================================
  publish:
    name: Build and Push to Docker Hub
    needs: integration-test

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------
      # CHECK DOCKER HUB SECRETS
      # ------------------------------------------
      - name: Check Docker Hub secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Checking Docker Hub credentials..."

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is empty"
            echo "Please check GitHub Settings > Secrets and variables > Actions"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is empty"
            echo "Please check GitHub Settings > Secrets and variables > Actions"
            exit 1
          fi

          echo "Docker Hub credentials are available"

      # ------------------------------------------
      # Login Docker Hub
      # ------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------
      # Setup Buildx
      # ------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------
      # Build and Push
      # ------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      # ------------------------------------------
      # Show pushed image
      # ------------------------------------------
      - name: Show Docker image
        run: |
          echo "Docker image pushed successfully:"
          echo "${{ env.DOCKER_IMAGE }}:latest"
          echo "${{ env.DOCKER_IMAGE }}:${{ github.sha }}"


  # ==========================================
  # JOB 3: DEPLOY TO LOCAL DOCKER ENGINE
  # ==========================================
  deploy-local:
    name: Deploy to Local Docker Engine
    needs: publish

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - product-api-local

    steps:
      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------
      # CHECK DOCKER
      # ------------------------------------------
      - name: Check Docker environment
        shell: pwsh
        run: |
          Write-Host "Checking Docker..."

          docker --version

          if ($LASTEXITCODE -ne 0) {
            throw "Docker is not available"
          }

          docker compose version

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose is not available"
          }

      # ------------------------------------------
      # Login Docker Hub
      # ------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------
      # Pull exact image
      # ------------------------------------------
      - name: Pull production image
        shell: pwsh
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $image = "${{ env.DOCKER_IMAGE }}:$env:IMAGE_TAG"

          Write-Host "Pulling image:"
          Write-Host $image

          docker pull $image

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image pull failed"
          }

          Write-Host "Docker image pulled successfully"

      # ------------------------------------------
      # Deploy
      # ------------------------------------------
      - name: Deploy with Docker Compose
        shell: pwsh
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          Write-Host "Starting Docker Compose deployment..."

          docker compose `
            -f docker-compose-prod.yaml `
            up -d `
            --remove-orphans

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose deployment failed"
          }

          Write-Host "Docker Compose deployment successful"

      # ------------------------------------------
      # Show containers
      # ------------------------------------------
      - name: Show running containers
        shell: pwsh
        run: |
          docker ps

      # ------------------------------------------
      # Verify API health
      # ------------------------------------------
      - name: Verify deployed API health
        shell: pwsh
        run: |
          $healthy = $false

          Write-Host "Waiting for Product API to become healthy..."

          for ($i = 0; $i -lt 30; $i++) {

            $status = docker inspect `
              --format='{{.State.Health.Status}}' `
              product-api-prod-container 2>$null

            Write-Host "Attempt $($i + 1)/30 - Health status: $status"

            if ($status -eq "healthy") {
              Write-Host "Product API is healthy"
              $healthy = $true
              break
            }

            if ($status -eq "unhealthy") {
              Write-Host "Product API is unhealthy"
              Write-Host "========== CONTAINER LOG =========="
              docker logs product-api-prod-container
              Write-Host "==================================="
              throw "Product API is unhealthy"
            }

            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            Write-Host "Product API healthcheck timed out"
            Write-Host "========== CONTAINER LOG =========="
            docker logs product-api-prod-container
            Write-Host "==================================="
            throw "Product API healthcheck timed out"
          }

      # ------------------------------------------
      # Logout
      # ------------------------------------------
      - name: Logout from Docker Hub
        if: always()
        shell: pwsh
        run: |
          docker logout
